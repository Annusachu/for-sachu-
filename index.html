<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Sachu 💗</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6);
      color: #5a3042;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .heart {
      font-size: 70px;
      animation: beat 1s infinite;
    }

    .card {
      background: rgba(255,255,255,0.75);
      margin: 25px auto;
      padding: 25px;
      border-radius: 25px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(120,50,80,0.15);
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      background: #ff6f9f;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #surprise {
      display: none;
      margin-top: 20px;
      font-size: 20px;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="heart">💗</div>

    <h1>Hey Sachu...</h1>

    <p>
      I made a little corner of the internet<br>
      just for you. 🥹
    </p>

    <div class="card">
      <h2>💌 For My Favourite Person</h2>

      <p>
        You are a special part of my life,
        and I wanted to make something
        that is only for you.
      </p>

      <button onclick="showSurprise()">
        Click for a surprise 🎁
      </button>

      <div id="surprise">
        I love you, Sachu. ❤️
        <br><br>
        Happy Boyfriend Day! 🫶
      </div>
    </div>

  </section>

  <script>
    function showSurprise() {
      document.getElementById("surprise").style.display = "block";
    }
  </script>

</body>
</html>
